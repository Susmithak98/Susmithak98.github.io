<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Susmitha Kotharu — Senior AI Engineer</title>
<meta name="description" content="Susmitha Kotharu — Senior AI Engineer building production Generative AI, agentic AI, and RAG systems in healthcare and financial services." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #05060f;
    --bg-2: #0a0c1d;
    --panel: rgba(16, 19, 42, 0.55);
    --border: rgba(140, 160, 255, 0.14);
    --text: #e8ebff;
    --muted: #9aa1c7;
    --cyan: #22d3ee;
    --violet: #a78bfa;
    --pink: #f472b6;
    --grad: linear-gradient(120deg, var(--cyan), var(--violet) 55%, var(--pink));
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Space Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(1200px 800px at 75% 10%, #121638 0%, var(--bg) 60%) fixed;
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  main, nav, footer { position: relative; z-index: 1; }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 6vw;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: rgba(5, 6, 15, 0.45);
    border-bottom: 1px solid transparent;
    transition: border-color .3s;
  }
  nav.scrolled { border-bottom-color: var(--border); }
  .logo { font-family: var(--mono); font-weight: 500; font-size: 15px; }
  .logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--muted); }
  .nav-links a:hover { color: var(--text); }
  @media (max-width: 720px) { .nav-links { display: none; } }

  section { padding: 120px 6vw; max-width: 1240px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); color: var(--cyan); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
  h2 { font-size: clamp(30px, 4vw, 46px); line-height: 1.1; margin-bottom: 40px; font-weight: 600; }

  /* Hero */
  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding-top: 140px; }
  .hero-inner { max-width: 640px; }
  .status { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; color: var(--muted);
    border: 1px solid var(--border); padding: 6px 14px; border-radius: 99px; background: var(--panel); margin-bottom: 28px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .hero h1 { font-size: clamp(44px, 7vw, 88px); line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
  .hero h1 .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .typed { font-family: var(--mono); font-size: clamp(16px, 2vw, 21px); color: var(--muted); margin: 22px 0 18px; min-height: 1.6em; }
  .typed b { color: var(--cyan); font-weight: 500; }
  .typed .caret { display: inline-block; width: 9px; height: 1.1em; background: var(--cyan); vertical-align: -3px; margin-left: 3px; animation: blink 1s steps(1) infinite; }
  .tagline { font-size: 18px; color: var(--muted); max-width: 540px; }
  .cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px; border-radius: 12px; font-weight: 500; font-size: 15px; transition: transform .2s, box-shadow .2s, background .2s; }
  .btn-primary { background: var(--grad); color: #07081a; box-shadow: 0 10px 40px -10px rgba(167,139,250,.7); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 50px -10px rgba(34,211,238,.7); }
  .btn-ghost { border: 1px solid var(--border); background: var(--panel); backdrop-filter: blur(8px); }
  .btn-ghost:hover { border-color: var(--violet); transform: translateY(-2px); }
  .scroll-hint { position: absolute; bottom: 36px; left: 6vw; font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .scroll-hint::before { content: ""; width: 40px; height: 1px; background: var(--muted); }

  /* Glass panel */
  .glass { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  /* About */
  .about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }
  .about-text p { color: var(--muted); font-size: 17px; margin-bottom: 18px; }
  .about-text p strong { color: var(--text); font-weight: 500; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat { padding: 26px 22px; }
  .stat .v { font-size: 38px; font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.1; }
  .stat .l { color: var(--muted); font-size: 14px; margin-top: 6px; }
  @media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; } }

  /* Skills */
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .skill-group { padding: 28px; }
  .skill-group h3 { font-size: 17px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .skill-group h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--grad); transform: rotate(45deg); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-family: var(--mono); font-size: 12.5px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,.03); color: #cdd2f5; transition: border-color .2s, color .2s; }
  .chip:hover { border-color: var(--cyan); color: var(--cyan); }

  /* Projects */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
  @media (max-width: 420px) { .projects-grid { grid-template-columns: 1fr; } }
  .card-wrap { perspective: 1000px; }
  .card {
    position: relative; padding: 30px; height: 100%; display: flex; flex-direction: column;
    transform-style: preserve-3d; transition: transform .15s ease-out, border-color .3s;
    --mx: 50%; --my: 50%;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(400px circle at var(--mx) var(--my), rgba(167,139,250,.18), transparent 45%);
  }
  .card:hover { border-color: rgba(167,139,250,.45); }
  .card:hover::after { opacity: 1; }
  .card > * { transform: translateZ(30px); }
  .card .badge { align-self: flex-start; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; background: rgba(34,211,238,.1); color: var(--cyan); margin-bottom: 18px; }
  .card h3 { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
  .card p { color: var(--muted); font-size: 15px; flex: 1; }
  .card .metric { font-family: var(--mono); font-size: 13px; color: var(--violet); margin-top: 16px; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .card .tags span { font-family: var(--mono); font-size: 11.5px; color: #b9bfe6; padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,.05); }
  .card .links { display: flex; gap: 18px; margin-top: 22px; font-size: 14px; font-weight: 500; }
  .card .links a { color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 2px; transition: color .2s, border-color .2s; }
  .card .links a:hover { color: var(--cyan); border-color: var(--cyan); }

  /* Experience */
  .timeline { position: relative; padding-left: 34px; }
  .timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--cyan), var(--violet), transparent); }
  .job { position: relative; padding: 26px 30px; margin-bottom: 22px; }
  .job::before { content: ""; position: absolute; left: -34px; top: 32px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--cyan); box-shadow: 0 0 14px var(--cyan); }
  .job-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .job h3 { font-size: 19px; font-weight: 600; }
  .job h3 span { color: var(--violet); font-weight: 500; }
  .job .period { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .job ul { list-style: none; color: var(--muted); font-size: 15px; }
  .job li { padding-left: 20px; position: relative; margin-bottom: 6px; }
  .job li::before { content: "▹"; position: absolute; left: 0; color: var(--cyan); }

  /* Contact */
  .contact { text-align: center; padding: 70px 30px; }
  .contact h2 { margin-bottom: 18px; }
  .contact p { color: var(--muted); font-size: 18px; max-width: 520px; margin: 0 auto 34px; }
  .contact .cta { justify-content: center; }
  .socials { display: flex; justify-content: center; gap: 22px; margin-top: 34px; font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .socials a:hover { color: var(--cyan); }

  footer { text-align: center; padding: 40px 6vw 50px; font-family: var(--mono); font-size: 12.5px; color: #5d6390; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .card { transition: none; }
  }
  /* ---------- Talking anime avatar: large cutout on the right ---------- */
  .buddy { position: fixed; right: 0; bottom: 0; height: min(76vh, 700px); z-index: 30; }
  .avatar-btn { position: relative; height: 100%; aspect-ratio: 588 / 744; border: 0; background: none; padding: 0; cursor: pointer; display: block; color: var(--text); font: inherit; }
  .avatar-btn::before { content: ""; position: absolute; inset: 8% 4% 0; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%, rgba(124,92,255,.38), rgba(34,211,238,.10) 45%, transparent 70%); filter: blur(10px); transition: opacity .4s; }
  .cut { position: relative; height: 100%; animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .cut img { position: relative; height: 100%; width: 100%; object-fit: contain; object-position: bottom;
    filter: drop-shadow(0 0 1.5px rgba(34,211,238,.9)) drop-shadow(0 0 22px rgba(124,92,255,.55)); transition: filter .4s; }
  .holo-scan { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; overflow: hidden;
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: bottom; mask-position: bottom;
    background: repeating-linear-gradient(0deg, rgba(34,211,238,.09) 0 2px, transparent 2px 5px); }
  .holo-scan::after { content: ""; position: absolute; left: 0; right: 0; height: 18%; top: -20%;
    background: linear-gradient(transparent, rgba(34,211,238,.30), transparent); animation: scan 5s ease-in-out infinite; }
  @keyframes scan { 0% { top: -20%; } 55%, 100% { top: 105%; } }
  .pad { position: absolute; left: 12%; right: 12%; bottom: 1.5%; height: 7%; border-radius: 50%;
    border: 1.5px solid rgba(34,211,238,.7); box-shadow: 0 0 30px rgba(34,211,238,.5), inset 0 0 30px rgba(34,211,238,.35);
    animation: pad 3s ease-in-out infinite; }
  @keyframes pad { 50% { transform: scale(1.06); opacity: .6; } }
  .talking .cut img { filter: drop-shadow(0 0 2px rgba(34,211,238,1)) drop-shadow(0 0 34px rgba(124,92,255,.85)); }
  .talking::before { opacity: 1.4; }
  .waving .cut { animation: hop .8s ease-in-out 2; }
  @keyframes hop { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-12px) rotate(-1.5deg); } 70% { transform: translateY(-4px) rotate(1.5deg); } }
  .eq { position: absolute; left: 0; right: 0; bottom: 13%; display: flex; justify-content: center; align-items: center; gap: 4px; height: 30px; opacity: 0; transition: opacity .3s; }
  .talking .eq { opacity: 1; }
  .eq i { width: 4px; height: 100%; border-radius: 2px; background: var(--grad); transform: scaleY(.15); }
  .talking .eq i { animation: eq .45s ease-in-out infinite alternate; }
  .eq i:nth-child(2n) { animation-delay: -.15s !important; } .eq i:nth-child(3n) { animation-delay: -.3s !important; } .eq i:nth-child(5n) { animation-delay: -.22s !important; }
  @keyframes eq { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
  .nameplate { position: absolute; left: 50%; bottom: 4.5%; transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--muted);
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 99px; background: rgba(10,12,29,.75); backdrop-filter: blur(8px); }
  .nameplate b { color: #34d399; font-weight: 400; }

  .bubble {
    position: absolute; right: 80%; top: 6%; width: min(340px, 60vw); padding: 16px 18px 12px; z-index: 2;
    background: rgba(14, 16, 38, 0.94); border: 1px solid rgba(167,139,250,.45); border-radius: 18px 4px 18px 18px;
    box-shadow: 0 18px 50px -12px rgba(124, 92, 255, .55); backdrop-filter: blur(12px);
    font-size: 14.5px; line-height: 1.5; color: var(--text);
    transform-origin: top right; transition: opacity .3s, transform .3s;
  }
  .bubble.hidden { opacity: 0; transform: scale(.85); pointer-events: none; }
  .bubble::after { content: ""; position: absolute; right: -9px; top: 16px; width: 16px; height: 16px; background: inherit;
    border-right: 1px solid rgba(167,139,250,.45); border-top: 1px solid rgba(167,139,250,.45); transform: rotate(45deg); }
  .bubble .who { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); margin-bottom: 4px; }
  .bubble-text { min-height: 3em; }
  .bubble-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .bubble-actions button, .bubble-close {
    font: 500 12px var(--mono); color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; transition: border-color .2s, color .2s;
  }
  .bubble-actions button:hover { border-color: var(--cyan); color: var(--cyan); }
  .bubble-actions button.primary { background: var(--grad); color: #07081a; border-color: transparent; font-weight: 600; }
  .bubble-actions button.primary:hover { color: #07081a; filter: brightness(1.1); }
  .bubble-close { position: absolute; top: 8px; right: 8px; padding: 0 7px; line-height: 20px; border-radius: 6px; }

  @media (min-width: 1000px) { main, footer { margin-right: min(46vh, 430px); } }
  @media (max-width: 999px) {
    .buddy { height: 230px; }
    .eq, .nameplate { display: none; }
    .bubble { top: auto; bottom: calc(100% - 20px); right: 12px; width: min(290px, 80vw); border-radius: 18px 18px 4px 18px; font-size: 13.5px; transform-origin: bottom right; }
    .bubble::after { top: auto; bottom: -9px; right: 50px; transform: rotate(135deg); }
  }
  @media (prefers-reduced-motion: reduce) { .cut, .pad, .holo-scan::after, .talking .eq i, .waving .cut { animation: none; } }
</style>
</head>

(function typer() {

  (function tick() {

// ---------- Talking anime avatar ----------
(function avatar() {
  const A = PROFILE.avatar; if (!A) return;
  const btn = $("avatar-btn"), bubble = $("bubble"), textEl = $("bubble-text"), voiceBtn = $("voice-btn"), tourBtn = $("tour-btn");
  const order = Object.keys(A.lines);
  $("bubble-who").textContent = A.name;
  $("nameplate").innerHTML = `<b>●</b> ${esc(A.nameplate || A.name)}`;
  const photo = $("avatar-photo");
  photo.src = A.photo;
  const scan = $("holo-scan");
  scan.style.webkitMaskImage = scan.style.maskImage = `url("${A.photo}")`;
  photo.onerror = () => { $("buddy").style.display = "none"; };

  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  let voiceOn = !!(synth && A.voiceOnByDefault), unlocked = false, voice = null;
  let section = "home", idx = 0, said = new Set(), touring = false, run = 0, hideTimer = null, waveTimer = null, current = "";
  const setVoiceBtn = () => { voiceBtn.textContent = voiceOn ? "🔇 Mute" : "🔊 Hear me"; voiceBtn.setAttribute("aria-pressed", voiceOn); };
  if (!synth) voiceBtn.style.display = "none"; setVoiceBtn();

  const pickVoice = () => {
    if (!synth) return;
    const vs = synth.getVoices().filter((v) => /^en/i.test(v.lang));
    voice = vs.find((v) => /aria|jenny|samantha|zira|female|google us english|victoria|karen|moira|tessa|natural/i.test(v.name)) || vs[0] || null;
  };
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const wave = (ms = 1800) => { if (reduceMotion) return; btn.classList.add("waving"); clearTimeout(waveTimer); waveTimer = setTimeout(() => btn.classList.remove("waving"), ms); };

  // Say one line: types it out and (if voice is on) speaks it. Resolves when finished.
  function say(text) {
    const my = ++run; current = text;
    bubble.classList.remove("hidden"); clearTimeout(hideTimer);
    if (synth) synth.cancel();
    btn.classList.add("talking");
    textEl.textContent = "";
    const typing = new Promise(async (res) => {
      for (let i = 1; i <= text.length; i++) {
        if (my !== run) return res();
        textEl.textContent = text.slice(0, i);
        if (!reduceMotion) await sleep(24);
      }
      res();
    });
    const speaking = new Promise((res) => {
      if (!(voiceOn && unlocked && synth)) {
        // no audio: give readers time proportional to the length of the line
        return setTimeout(res, Math.max(2200, text.split(/\s+/).length * 330));
      }
      const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, ""));
      if (voice) u.voice = voice;
      u.pitch = 1.1; u.rate = 1.0;
      u.onend = u.onerror = () => res();
      synth.speak(u);
    });
    return Promise.all([typing, speaking]).then(() => {
      if (my !== run) return;
      btn.classList.remove("talking");
      if (!touring && innerWidth < 1000) hideTimer = setTimeout(() => bubble.classList.add("hidden"), 7000);
    });
  }
  const stop = () => { run++; if (synth) synth.cancel(); btn.classList.remove("talking"); };

  // Guided tour: scroll to each section and explain it, line by line
  async function tour() {
    if (touring) { endTour(); return; }
    touring = true; tourBtn.textContent = "■ Stop tour"; wave(2400);
    const myRun = Symbol(); tour.active = myRun;
    for (const sec of order) {
      if (tour.active !== myRun) return;
      const el = $(sec); if (el) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      section = sec; said.add(sec);
      await sleep(900);
      for (let i = 0; i < A.lines[sec].length; i++) {
        if (tour.active !== myRun) return;
        idx = i; await say(A.lines[sec][i]); await sleep(450);
      }
    }
    if (tour.active === myRun) { wave(2400); endTour(); }
  }
  function endTour() { touring = false; tour.active = null; tourBtn.textContent = "▶ Give me the tour"; }

  const lineFor = (sec, i) => { const l = A.lines[sec] || A.lines.home; return l[i % l.length]; };
  const next = () => { if (touring) endTour(); idx++; say(lineFor(section, idx)); };

  tourBtn.addEventListener("click", (e) => { e.stopPropagation(); unlocked = true; tour(); });
  btn.addEventListener("click", () => { unlocked = true; wave(); if (touring) return; bubble.classList.contains("hidden") ? say(lineFor(section, idx)) : next(); });
  $("next-btn").addEventListener("click", () => { unlocked = true; next(); });
  $("bubble-close").addEventListener("click", () => { endTour(); stop(); bubble.classList.add("hidden"); });
  voiceBtn.addEventListener("click", () => {
    unlocked = true; voiceOn = !voiceOn; setVoiceBtn();
    if (voiceOn) say(current || lineFor(section, idx)); else if (synth) synth.cancel();
  });

  // Browsers only allow speech after the visitor interacts. On the first click or key press, say the current line out loud.
  const unlock = (e) => {
    if (unlocked) return; unlocked = true;
    if (e && e.target && e.target.closest && e.target.closest(".bubble-actions, .avatar-btn")) return; // those buttons handle themselves
    if (voiceOn && current && !touring) say(current);
  };
  addEventListener("pointerdown", unlock, { once: true, capture: true });
  addEventListener("keydown", unlock, { once: true, capture: true });

  // When the visitor scrolls on their own, explain the section they land on
  const secObs = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (touring || !e.isIntersecting || e.target.id === section) return;
      section = e.target.id; idx = 0;
      if (section === "contact") wave(2400);
      if (!said.has(section) && !bubble.classList.contains("hidden")) { said.add(section); say(lineFor(section, 0)); }
    });
  }, { threshold: 0.45 });
  order.forEach((id) => { const el = $(id); if (el) secObs.observe(el); });

  setTimeout(() => { said.add("home"); wave(2400); say(lineFor("home", 0)).then(() => { if (!touring && section === "home" && idx === 0) { idx = 1; say(lineFor("home", 1)); } }); }, 1200);
})();

// ---------- 3D neural network scene ----------
try {

    const j = 1 + (Math.random() - 0.5) * 0.12;
    nodes.push(new THREE.Vector3(Math.cos(th) * rr * R * j, y * R * j, Math.sin(th) * rr * R * j));

  const layout = () => {
    const wide = innerWidth > 900;
    return { x: wide ? 3.3 : 0, y: wide ? 0.3 : -0.6, s: wide ? 0.9 : 0.75 };
  };
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  (function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    const speed = reduceMotion ? 0.15 : 1;
    const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    const p = scrollY / maxScroll;
    const L = layout();

    // Scroll choreography: drift from right to left and recede
    root.position.x += ((L.x - p * L.x * 0.6) - root.position.x) * 0.06;
    root.position.y += ((L.y + Math.sin(p * Math.PI) * 0.4) - root.position.y) * 0.06;
    root.scale.setScalar(L.s * (1 - p * 0.25));
    camera.position.z += ((7 + p * 3) - camera.position.z) * 0.06;

    mouse.x += (target.x - mouse.x) * 0.05; mouse.y += (target.y - mouse.y) * 0.05;
    tilt.rotation.y = mouse.x * 0.6; tilt.rotation.x = mouse.y * 0.4;

    brain.rotation.y += dt * 0.12 * speed * (1 + p * 2);
    brain.rotation.x = Math.sin(t * 0.2) * 0.15;
    core.rotation.x -= dt * 0.3 * speed; core.rotation.z += dt * 0.2 * speed;
    coreGlow.material.opacity = 0.28 + Math.sin(t * 1.6) * 0.08;
    rings[0].rotation.z += dt * 0.15 * speed; rings[1].rotation.z -= dt * 0.1 * speed;
    stars.rotation.y += dt * 0.008 * speed; stars.rotation.x = p * 0.5;

    pulses.forEach((pl, i) => {
      pl.t += dt * pl.s * speed;
      if (pl.t > 1) { pl.t = 0; pl.e = edges[(Math.random() * edges.length) | 0]; }
      a.copy(nodes[pl.e[0]]); b.copy(nodes[pl.e[1]]);
      a.lerp(b, pl.t).toArray(pPos, i * 3);
    });
    pulseGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  })();
} catch (err) {
  console.warn("3D background unavailable:", err);
}
</script>
